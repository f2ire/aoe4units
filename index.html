<!doctype html>
<html lang="en">

<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="author" content="AoE4 Units" />
  <!-- Per-page <title>, description, canonical and Open Graph tags are injected
       at render time via <Head> (see src/routes.tsx and the SEO pages) so each
       pre-rendered route gets unique, non-duplicated metadata. -->

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "AoE4 Units",
    "url": "https://aoe4units.com/",
    "description": "Compare Age of Empires IV units with combat simulation, tech and ability toggles, kiting and equal-cost modes.",
    "applicationCategory": "GameApplication",
    "operatingSystem": "Web",
    "browserRequirements": "Requires JavaScript and a modern browser",
    "inLanguage": "en",
    "isAccessibleForFree": true,
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "USD"
    },
    "about": {
      "@type": "VideoGame",
      "name": "Age of Empires IV"
    }
  }
  </script>

  <script data-goatcounter="https://aoe4unitsupport.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
